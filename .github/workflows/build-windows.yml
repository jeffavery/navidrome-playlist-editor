name: Build Windows standalone

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build portable application
        run: python -m PyInstaller --noconfirm --clean desktop.spec
      - name: Smoke-test packaged executable
        shell: pwsh
        run: '& "dist\Navidrome Playlist Editor\Navidrome Playlist Editor.exe" --self-test'
      - name: Add the quick-start guide
        shell: pwsh
        run: Copy-Item "START HERE.md" "dist\Navidrome Playlist Editor\START HERE.md"
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist\Navidrome Playlist Editor\*" -DestinationPath "dist\Navidrome-Playlist-Editor-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Navidrome-Playlist-Editor-Windows
          path: dist/Navidrome-Playlist-Editor-Windows.zip
          if-no-files-found: error
